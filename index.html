<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.ico">
<title>再活一次・手機 B</title>
<style>
@font-face{font-family:FP10;src:url(assets/fonts/fp10.ttf)}
@font-face{font-family:NotoTC;src:url(assets/fonts/notosans_tc_subset.otf)}
@font-face{font-family:FusionPixel8;src:url(assets/fonts/fusion-pixel-8px-proportional-zh_hant.ttf);font-display:block}
html,body{margin:0;height:100%;background:#0b0a0d;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center;gap:40px}
#wrap{position:relative}

/* —— 直式 —— */
#phone{position:absolute;left:0;top:0;width:1080px;height:2340px;transform-origin:0 0;background:#141118;
  font-family:NotoTC,sans-serif;color:#f0e8d6;-webkit-font-smoothing:antialiased}
#phone .scene-box{position:absolute;left:60px;top:120px;width:960px;height:540px}
#phone canvas.scene{width:960px;height:540px;image-rendering:pixelated;display:block}
#phone #corner{position:absolute;left:72px;top:130px;padding:2px 10px;background:rgba(10,8,12,.62);font:30px FP10;color:#f0e8d6;text-shadow:3px 3px 0 #0a080c;pointer-events:none;z-index:2}
#phone #status{position:absolute;left:60px;top:690px;width:960px;font-size:36px;line-height:48px;color:#b0a492}
#phone #rule{position:absolute;left:60px;top:768px;width:960px;height:3px;background:#3a3240}
#phone #text{position:absolute;left:60px;top:810px;width:960px;font-size:48px;line-height:76px;letter-spacing:1px}
#phone #text .sec{margin:0;white-space:pre;overflow-wrap:normal;word-break:keep-all}
#phone #text .sec.dim{opacity:.45}
#phone #text .sec + .sec{margin-top:76px} /* blank line between sections */
#phone #pageind{position:absolute;right:60px;top:690px;font-size:28px;color:#7c7266}
#phone #btns{position:absolute;left:60px;width:960px;bottom:100px;display:flex;flex-direction:column;gap:24px}
#phone #btns button{height:144px;font:48px NotoTC;color:#f0e8d6;background:#1a161e;border:6px solid #d6c8ac;box-shadow:inset 0 0 0 3px #0a080c;cursor:pointer}
#phone #btns button.sel{background:#463a3e}
#phone.messages .scene-box{position:absolute;left:60px;top:120px;width:960px;height:1440px}
#phone.messages canvas.scene{width:960px;height:1440px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#phone.messages #corner,#phone.messages #status,#phone.messages #rule,#phone.messages #text,#phone.messages #pageind{display:none}
#phone.messages #btns{display:none}
#phone.reader .scene-box,#phone.reader #corner,#phone.reader #status,#phone.reader #rule{display:none}
#phone.reader #text{top:120px;height:1800px}

/* —— 橫式（抽屜） —— */
#stage{position:absolute;left:0;top:0;width:2340px;height:1080px;transform-origin:0 0;background:#121014;overflow:hidden;font-family:NotoTC,sans-serif;display:none}
#stage .scene-box{position:absolute;left:0;top:0;width:2340px;height:1080px;transition:left .25s}
#stage.dragging .scene-box{transition:none}
#stage canvas.scene{width:2340px;height:1080px;image-rendering:pixelated;display:block}
#stage #tag{position:absolute;left:120px;top:24px;background:rgba(18,15,20,.75);color:#f0e8d6;font-size:30px;padding:4px 14px;border-radius:6px;z-index:3;font-family:NotoTC,sans-serif}
#stage #caption{position:absolute;left:120px;bottom:48px;max-width:1500px;background:rgba(18,15,20,.72);color:#b0a492;font-size:36px;padding:14px 26px;border-radius:10px;transition:none;z-index:3;pointer-events:none}
#stage #panel{position:absolute;top:0;right:0;height:100%;width:0;background:#121014;box-shadow:none;transition:width .25s;z-index:4}
#stage #panel.dragging{transition:none}
#stage #inner{position:absolute;inset:0 60px 40px 56px;display:flex;flex-direction:column;overflow:hidden}
#stage #lstatus{color:#b0a492;font-size:34px;line-height:1.5;margin:44px 0 26px}
#stage #ltext{flex:1;overflow:hidden}
#stage #ltext .sec{color:#f0e8d6;font-size:40px;line-height:1.6;margin:0 0 30px;white-space:pre;overflow-wrap:normal;word-break:keep-all}
#stage #ltext .sec.dim{opacity:.45}
#stage #lpageind{color:#7c7266;font-size:28px;margin-bottom:8px}
#stage #lbtns{margin-top:auto;display:grid;gap:24px}
#stage #lbtns button{height:130px;font:40px NotoTC;color:#b0a492;background:#1a161e;border:3px solid #786c68;border-radius:10px;cursor:pointer}
#stage #lbtns button.sel{color:#f0e8d6;border-color:#e8be78;background:#463a3e}
#stage #handle{position:absolute;top:180px;left:-56px;width:56px;height:220px;margin-top:0;background:#121014;border-radius:14px 0 0 14px;cursor:ew-resize;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:none;filter:none;outline:none}
#stage #handle span{width:8px;height:90px;border-left:3px solid #786c68;border-right:3px solid #786c68;pointer-events:none}
#stage #dot{position:absolute;top:18px;left:18px;width:18px;height:18px;border-radius:50%;background:#e8be78;display:none}
#stage.reader #panel{width:100% !important}
#stage.reader .scene-box,#stage.reader #tag,#stage.reader #caption,#stage.reader #handle{display:none}

#side{display:none;color:#ddd;font:14px/1.5 sans-serif;max-width:380px;padding:16px}
#side h3{margin:4px 0}
#side li{margin:2px 0}
#side .warn{color:#ffb0c8}
#side .miss-group{margin:10px 0 4px;font-weight:700}
#side .miss-group.demo{color:#9ad}
#side #miss ul{margin:0 0 8px;padding-left:18px}
#side button{display:block;margin:6px 0;padding:6px 10px;cursor:pointer}
</style></head><body>
<div id="wrap">
  <!-- 直式 -->
  <div id="phone">
    <div class="scene-box"><canvas class="scene" id="sceneP" width="480" height="270"></canvas></div>
    <div id="corner"></div>
    <div id="status"></div><div id="rule"></div>
    <div id="pageind"></div>
    <div id="text"></div>
    <div id="btns"></div>
  </div>
  <!-- 橫式 -->
  <div id="stage">
    <div class="scene-box" id="sceneBoxL"><canvas class="scene" id="sceneL" width="2340" height="1080"></canvas></div>
    <div id="tag"></div>
    <div id="caption"></div>
    <div id="panel">
      <div id="handle"><span></span><div id="dot"></div></div>
      <div id="inner">
        <div id="lstatus"></div>
        <div id="lpageind"></div>
        <div id="ltext"></div>
        <div id="lbtns"></div>
      </div>
    </div>
  </div>
</div>
<div id="side">
  <h3>缺圖清單 <span id="missCount">0</span></h3>
  <div>粉紅方塊＝manifest 沒有的素材；動作缺的退回 idle。示範用 id 不算正式缺圖。</div>
  <div id="miss"></div>
  <h3>作者警告</h3>
  <ul id="warns"></ul>
  <button id="dl">下載 missing_assets.json</button>
  <button id="togOrient">切換直／橫</button>
  <button id="snap0">抽屜收起 (0)</button>
  <button id="snap820">抽屜 820</button>
  <button id="snap1300">抽屜 1300</button>
</div>
<script src="birth-month.js"></script>
<script src="calendar.js"></script>
<script src="commute_logic.js"></script>
<script src="commute.js"></script>
<script src="messages_text.js"></script>
<script src="messages_logic.js"></script>
<script src="messages.js"></script>
<script src="standing_points.js"></script>
<script src="dining_r4d.js"></script>
<script src="game.js"></script>
</body></html>
